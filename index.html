<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryks Cool Games</title>
  <style>
    /* -------------------- Reset -------------------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { height: 100%; font-family: 'Arial', sans-serif; }

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a2a6c, #5082ff, #fdbb2d);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
}

.app-container {
    width: 90%;
    max-width: 1200px;
    min-height: 100vh;
    background: rgba(0, 0, 0, 0.8);
    border-radius: 15px;
    padding: 20px;
    color: white;
    overflow: hidden;
}

/* -------------------- Welcome Box -------------------- */
.welcome-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.9);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transition: opacity 0.3s ease;
    text-align: center;
}

.welcome-box h1 {
    font-size: 2rem;
    margin-bottom: 15px;
}

.welcome-box p {
    font-size: 1rem;
    margin-bottom: 20px;
}

.welcome-box button {
    background: #ff4c4c;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.3s;
}

.welcome-box button:hover {
    background: #e03636;
}

/* -------------------- Layout -------------------- */
.sidebar {
    width: 80px;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
}

.logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
}

.logo img {
    width: 40px;
    height: 40px;
    margin-bottom: 5px;
    border-radius: 50%;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.nav-btn {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 1.5rem;
    transition: transform 0.2s;
}

.nav-btn:hover {
    transform: scale(1.2);
}

/* -------------------- Main Content -------------------- */
.main-content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

/* -------------------- Game Viewer -------------------- */
.viewer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 999;
}

.viewer.hidden {
    display: none;
}

.viewer-header {
    width: 100%;
    max-width: 1200px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: white;
}

#closeBtn, #fullScreenBtn {
    background: #ff4c4c;
    border: none;
    border-radius: 6px;
    color: white;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    transition: background 0.2s;
}

#closeBtn:hover, #fullScreenBtn:hover {
    background: #e03636;
}

iframe#gameFrame {
    width: 90%;
    height: 80vh;
    border: none;
    border-radius: 12px;
}

/* -------------------- Background Animation -------------------- */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
  </style>
</head>
<body>

  <!-- Welcome Box -->
  <div id="welcomeBox" class="welcome-box">
    <h1>Ryks Cool Games</h1>
    <p>Ryk on top</p>
    <button onclick="dismissWelcomeBox()">OK</button>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="logo.png" alt="Logo">
        <span>Ales Epik Games</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <section class="featured" hidden="hidden">
        <h2>Featured</h2>
        <div class="featured-grid" id="featuredZones"></div>
      </section>

      <div class="controls">
        <input type="text" id="search" placeholder="Search games...">
        <select id="filterOptions"></select>
        <select id="sortOptions">
          <option value="id">Sort by ID</option>
          <option value="name">Sort by Name</option>
          <option value="popular">Sort by Popularity</option>
        </select>
      </div>

      <section class="games">
        <h2>All Games</h2>
        <div class="grid" id="zones"></div>
      </section>
    </main>
  </div>

  <!-- Game Viewer -->
  <div id="viewer" class="viewer hidden">
    <div class="viewer-header">
      <span id="gameTitle"></span>
      <button id="closeBtn">Close</button>
      <button id="fullScreenBtn">Full Screen</button>
    </div>
    <iframe id="gameFrame"></iframe>
  </div>

        console.error(err);
